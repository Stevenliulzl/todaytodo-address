<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>今日待办 · 地址播报</title>
<style>
:root{--green:#2E9E5B;--bg:#F2F2F2;--panel:#fff;--text:#1a1a1a;--sub:#8a8a8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(160deg,#2E9E5B,#1F7A45);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 16px 50px rgba(0,0,0,.28);text-align:center}
.ic{width:70px;height:70px;border-radius:18px;background:#1F1F1F;color:#fff;font-size:42px;line-height:70px;margin:0 auto 16px}
h1{font-size:22px;margin:0 0 4px;color:#111;font-weight:700}
.sub{font-size:13px;color:var(--sub);margin:0 0 22px}
.addrbox{background:#F6F6F8;border-radius:12px;padding:12px 14px;margin-bottom:16px;word-break:break-all;text-align:left}
.addrlabel{font-size:11px;color:var(--sub);margin-bottom:4px}
.addr{font-size:14px;color:#0a7d3e;font-weight:600;line-height:1.5}
.enter{display:block;width:100%;height:52px;line-height:52px;border-radius:13px;background:var(--green);color:#fff;
  font-size:17px;font-weight:700;text-decoration:none;margin-bottom:12px;box-shadow:0 6px 16px rgba(46,158,91,.35)}
.enter:active{background:#248049}
.copy{display:block;width:100%;height:44px;line-height:44px;border:1px solid #DDD;border-radius:12px;background:#fff;
  color:#333;font-size:15px;cursor:pointer;font-family:inherit}
.copy:active{background:#f0f0f2}
.btnrow{display:flex;gap:10px}
.btnrow .copy{flex:1;width:auto}
.tip{margin-top:16px;font-size:12px;color:var(--sub);line-height:1.7}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#E8F6EE;color:#1F7A45;margin-top:8px}
.dead{color:#E5483C}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;
  font-size:14px;padding:9px 18px;border-radius:20px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="ic">✓</div>
  <h1>今日待办</h1>
  <p class="sub">网页版访问入口</p>

  <!-- 密码锁 -->
  <div id="lock">
    <input id="pw" type="password" placeholder="请输入访问密码" autocomplete="current-password"
      style="width:100%;height:46px;border:1px solid #DDD;border-radius:11px;padding:0 14px;font-size:16px;outline:none;margin-bottom:12px;font-family:inherit">
    <button class="enter" id="unlock" style="border:0;cursor:pointer;font-family:inherit">进入</button>
    <div id="pwmsg" style="color:#E5483C;font-size:13px;height:18px;margin-top:6px"></div>
  </div>

  <!-- 密码正确后显示 -->
  <div id="content" style="display:none">
    <div class="addrbox">
      <div class="addrlabel">当前最新地址</div>
      <div class="addr" id="addr">加载中…</div>
    </div>
    <a class="enter" id="enter" href="#" target="_blank" rel="noopener">进入今日待办 →</a>
    <div class="btnrow">
      <button class="copy" id="copy">复制地址</button>
      <button class="copy" id="refresh">🔄 刷新</button>
    </div>
    <div class="tip">
      这个地址可能随网络变化自动更新。<br>
      记不住就收藏本页，从这里进去永远是最新的。
      <div class="badge" id="status">正在获取最新地址…</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// 兜底地址（脚本会更新）；必须最先定义，供上方/下方都能用
var FALLBACK = "__ADDR__";
// 密码校验（SHA-256，前端不存明文）
const PW_HASH = "8e98375dc76baccafdc39b485dc9cb56273f2e4232d9a33dc9d91f2e0dae9c07"; // jintian2026
async function sha256(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function showContent(){
  document.getElementById('lock').style.display='none';
  document.getElementById('content').style.display='block';
  setAddr(FALLBACK);
  pullAddress(false);
}
(async function(){
  try{ var exp=Number(localStorage.getItem('td_broadcast_exp')||0); if(exp>Date.now()){ showContent(); return; } }catch(e){}
  const inp=document.getElementById('pw'), btn=document.getElementById('unlock'), msg=document.getElementById('pwmsg');
  async function tryUnlock(){
    const v=inp.value; if(!v){ msg.textContent='请输入密码'; return; }
    const h=await sha256(v);
    if(h===PW_HASH){ try{localStorage.setItem('td_broadcast_exp', String(Date.now()+30*24*3600*1000));}catch(e){} showContent(); }
    else { msg.textContent='密码不正确'; }
  }
  btn.onclick=tryUnlock;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
  inp.focus();
})();

// 读取同目录 address.json 里的真实地址
function setAddr(url, note){
  const addrEl = document.getElementById('addr');
  const enter = document.getElementById('enter');
  const status = document.getElementById('status');
  if(!url || !/^https?:\/\//.test(url)){
    addrEl.textContent = '暂时无法获取地址';
    addrEl.classList.add('dead');
    enter.removeAttribute('href');
    status.textContent = '请稍后刷新，或联系管理员';
    return;
  }
  addrEl.textContent = url;
  addrEl.classList.remove('dead');
  enter.href = url;
  status.textContent = note || ('更新于 ' + new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}));
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
document.getElementById('copy').onclick = () => {
  const url = document.getElementById('addr').textContent;
  if(!/^https?:\/\//.test(url)){ toast('没有可复制的地址'); return; }
  navigator.clipboard?.writeText(url).then(()=>toast('已复制地址')).catch(()=>{
    const i=document.createElement('input'); i.value=url; document.body.appendChild(i); i.select();
    try{document.execCommand('copy');toast('已复制地址')}catch(e){toast('复制失败，请长按选择')} i.remove();
  });
};
// 先显示兜底，再尝试拉 address.json（同目录）
function pullAddress(manual){
  return fetch('address.json?t=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if(j && j.url) setAddr(j.url, j.updatedAt ? ('更新于 ' + new Date(j.updatedAt).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})) : '');
      if(manual) toast('已刷新为最新地址');
    })
    .catch(() => { if(manual) toast('刷新失败，请稍后再试'); });
}
// 刷新按钮
let refreshing = false;
document.getElementById('refresh').onclick = () => {
  if(refreshing) return;
  refreshing = true;
  const btn = document.getElementById('refresh');
  const old = btn.textContent;
  btn.textContent = '刷新中…';
  document.getElementById('status').textContent = '正在获取最新地址…';
  pullAddress(true).finally(() => { btn.textContent = old; refreshing = false; });
};
// 每 60 秒自动刷新地址
setInterval(() => {
  pullAddress(false);
}, 60000);
</script>
</body>
</html>
